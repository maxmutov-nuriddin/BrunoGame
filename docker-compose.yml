# Local end-to-end check: authoritative server + the production frontend behind nginx.
#   npm run build && docker compose up --build
#   open http://localhost:8080
services:
  server:
    build: .
    environment:
      PORT: 8787
      ALLOWED_ORIGINS: http://localhost:8080
    ports:
      - "8787:8787"
  web:
    image: nginx:1.27-alpine
    volumes:
      - ./dist:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    depends_on:
      - server
